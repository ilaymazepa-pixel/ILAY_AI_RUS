name: Build ILAY AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить Buildozer
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Собрать Android APK
        run: |
          buildozer android debug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: ILAY-AI-APK
          path: bin/*.apk
